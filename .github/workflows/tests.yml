name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: API, UI and performance tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: pytest --tracing=retain-on-failure
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/

  postman:
    name: Postman collection (Newman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - run: npm install -g newman
      - name: Start the app
        run: |
          python -m app.app &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:5055/health && break; sleep 1; done
      - run: newman run postman/service-request-api.postman_collection.json -e postman/local.postman_environment.json
